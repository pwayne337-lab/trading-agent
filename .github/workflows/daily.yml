# This file is ready to use, but do not enable it until you have decided the
# repo visibility question in the README, under "Publishing the dashboard".
name: Daily agent run

on:
  # 21:30 UTC on weekdays. That is after the US close in both summer and
  # winter, so it never runs against a half-finished bar. GitHub's scheduler
  # can be late by several minutes under load, which does not matter here
  # because the agent trades the next session's open.
  schedule:
    - cron: "30 21 * * 1-5"
  # Lets you trigger a run by hand from the Actions tab.
  workflow_dispatch:

permissions:
  contents: write      # to commit the updated state back to the repo
  pages: write         # to publish the dashboard
  id-token: write

concurrency:
  group: daily-agent
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify the engine before letting it trade
        run: python -m tests.test_logic

      - name: Verify the whole daily run against a fake broker
        run: python -m tests.smoke_run

      - name: Run the agent
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          ALPACA_BASE_URL: ${{ secrets.ALPACA_BASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python agent.py run --submit

      # Runs even when the agent failed, because the failure is the thing most
      # worth publishing: a crash that commits nothing looks exactly like a
      # quiet day on the dashboard.
      - name: Commit the day's record
        if: always()
        run: |
          git config user.name "trading-agent"
          git config user.email "actions@github.com"
          # git add validates every pathspec before staging any of it, so if the
          # run died before dashboard.py created site/, `git add state site`
          # aborted and state/ was not committed either -- the step that
          # guarantees a record was the one that lost it.
          mkdir -p state site
          git add -A state site
          git diff --staged --quiet && exit 0
          git commit -m "run $(date -u +%Y-%m-%d)"
          # Anything landing on main between checkout and now makes this a
          # non-fast-forward push. Failing there would discard the runner and
          # with it today's state, equity row and run log -- after the orders
          # had already gone in.
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase --autostash || break
          done
          exit 1

      - uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: site

  publish:
    needs: run
    # `needs` alone requires success, so on a failed run this job was skipped
    # and the failure page -- uploaded one step earlier precisely so the
    # failure would be visible -- was never deployed. The live site kept
    # serving yesterday, which is exactly the "a crash looks like a quiet day"
    # outcome the upload step above exists to prevent.
    if: always()
    runs-on: ubuntu-latest
    # Same group as the publish-the-site workflow: Pages takes one deployment
    # at a time, so the two queue instead of racing.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
