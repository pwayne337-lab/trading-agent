# Puts a stop behind any position that has none, without waiting for the
# evening run. It opens nothing and closes nothing: the monitor command has no
# entry and no exit path at all. Where a bracket lost its stop and kept its
# take-profit, it cancels that orphaned target (which is what reserves the
# shares and blocks the stop) and puts back a linked stop-and-target pair.
#
# Runs on a schedule every weekday late morning, and on demand from the
# Actions tab: "Protect my positions now" -> Run workflow.
#
# Safe to run repeatedly: a position that already has a stop is left alone, and
# it finds nothing to do on a market holiday or an empty account.
name: Protect my positions now

on:
  # 16:00 UTC on weekdays. Cron does not follow daylight saving, so this is
  # 11am Central in summer and 10am in winter -- both comfortably inside the
  # 8:30am-3pm Central session, which is what matters. A stop that goes missing
  # after the open gets replaced within hours instead of at the close.
  schedule:
    - cron: "0 16 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write      # to commit what it did back to the repo
  pages: write         # to publish the rebuilt dashboard
  id-token: write

concurrency:
  # Never alongside the daily run. Both touch the same order book.
  group: daily-agent
  cancel-in-progress: false

jobs:
  protect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify the engine before letting it touch the account
        run: python -m tests.test_logic

      - name: Verify the whole path against a fake broker
        run: python -m tests.smoke_run

      - name: Protect anything holding no stop
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          ALPACA_BASE_URL: ${{ secrets.ALPACA_BASE_URL }}
        run: python agent.py monitor --submit

      - name: Commit what it did
        if: always()
        run: |
          git config user.name "trading-agent"
          git config user.email "actions@github.com"
          mkdir -p state site
          git add -A state site
          git diff --staged --quiet && exit 0
          git commit -m "protect $(date -u +%Y-%m-%dT%H:%M)"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase --autostash || break
          done
          exit 1

      # A push made with GITHUB_TOKEN does not trigger other workflows, so
      # pages.yml never fires for the commit above and the dashboard would sit
      # on the previous run's numbers until the next evening. daily.yml deploys
      # from inside itself for the same reason; this has to as well.
      - uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: site

  publish:
    needs: protect
    if: always()
    runs-on: ubuntu-latest
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
